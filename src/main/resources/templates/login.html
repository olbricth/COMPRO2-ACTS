<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Poppins&display=swap" rel="stylesheet">
    <style>
        body {
          font-family: 'Poppins', sans-serif;
          background: linear-gradient(45deg, #fcb0f1, #f9a1c6, #fbc2eb, #fcb69f);
          background-size: 400% 400%;
          animation: gradientAnimation 12s ease infinite;
          color: #fff;
          text-align: center;
          padding: 50px 0;
          margin: 0;
        }

        @keyframes gradientAnimation {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }

        .login-container {
          background: rgba(255, 255, 255, 0.1);
          border: 2px solid rgba(255, 255, 255, 0.3);
          backdrop-filter: blur(10px);
          border-radius: 20px;
          padding: 30px 20px;
          width: 320px;
          margin: 0 auto;
          box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }

        h2 {
          font-size: 30px;
          font-weight: 600;
          color: white;
          margin-bottom: 25px;
          font-family: 'Pacifico', cursive;
          text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.4);
        }

        label {
          display: block;
          text-align: left;
          margin-bottom: 5px;
          font-size: 14px;
          color: #ffe6f7;
        }

        input[type="text"], input[type="password"] {
          width: 70%;
          padding: 12px;
          margin-bottom: 15px;
          border-radius: 10px;
          border: none;
          background-color: rgba(255, 255, 255, 0.2);
          color: white;
          font-size: 16px;
          transition: 0.3s ease;
        }

        input::placeholder {
          color: #fce4ec;
        }

        input:focus {
          background-color: rgba(255, 255, 255, 0.3);
          outline: none;
          border: 1px solid #f78fb3;
        }

        button {
          width: 100%;
          padding: 12px;
          border-radius: 10px;
          background: linear-gradient(45deg, #f78fb3, #f8a5c2);
          color: white;
          border: none;
          font-size: 18px;
          cursor: pointer;
          font-weight: bold;
          transition: all 0.3s ease;
        }

        button:hover {
          background: linear-gradient(45deg, #f8a5c2, #f78fb3);
          transform: scale(1.03);
        }

        .error-message {
          color: #ffcccc;
          font-size: 15px;
          margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="login-container">
    <h2>Login</h2>
    <form method="post" action="/login">
        <label for="username">Username:</label><br>
        <input type="text" name="username" required><br><br>
        <label for="password">Password:</label><br>
        <input type="password" name="password" required><br><br>
        <button type="submit">Login</button>
    </form>
    <!-- Error message example (add your server-side error message here) -->
    <p class="error-message" id="error-message" style="display: none;"></p>
</div>

<script>
    // Example error message handler
    // You can set this dynamically based on your server-side response.
    const errorMessage = ""; // Set your error message here if applicable
    if (errorMessage) {
      document.getElementById('error-message').innerText = errorMessage;
      document.getElementById('error-message').style.display = 'block';
    }
</script>
</body>
</html>
