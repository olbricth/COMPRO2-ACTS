<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Poppins&display=swap" rel="stylesheet">
    <style>
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        body {
          font-family: 'Poppins', sans-serif;
          background: linear-gradient(45deg, #fcb0f1, #f9a1c6, #fbc2eb, #fcb69f);
          background-size: 400% 400%;
          animation: gradientAnimation 12s ease infinite;
          color: #4a0033;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          padding: 20px;
        }

        @keyframes gradientAnimation {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }

        .login-container {
          background: rgba(255, 255, 255, 0.1);
          border: 2px solid rgba(255, 255, 255, 0.3);
          backdrop-filter: blur(10px);
          border-radius: 20px;
          padding: 30px 25px;
          width: 100%;
          max-width: 400px;
          box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }

        h2 {
          font-size: 30px;
          font-weight: 600;
          color: white;
          margin-bottom: 25px;
          font-family: 'Pacifico', cursive;
          text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.4);
          text-align: center;
        }

        form {
          display: flex;
          flex-direction: column;
          align-items: center;
        }

        label {
          align-self: flex-start;
          margin-bottom: 6px;
          font-size: 14px;
          color: #7b1e57;
        }

        input[type="text"],
        input[type="password"] {
          width: 100%;
          padding: 12px;
          margin-bottom: 20px;
          border-radius: 10px;
          border: none;
          background-color: rgba(255, 255, 255, 0.2);
          color: #4a0033;
          font-size: 16px;
          transition: 0.3s ease;
        }

        input::placeholder {
          color: #a64d79;
        }

        input:focus {
          background-color: rgba(255, 255, 255, 0.3);
          outline: none;
          border: 1px solid #f78fb3;
        }

        button {
          width: 100%;
          padding: 12px;
          border-radius: 10px;
          background: linear-gradient(45deg, #f78fb3, #f8a5c2);
          color: white;
          border: none;
          font-size: 18px;
          cursor: pointer;
          font-weight: bold;
          transition: all 0.3s ease;
        }

        button:hover {
          background: linear-gradient(45deg, #f8a5c2, #f78fb3);
          transform: scale(1.03);
        }

        .error-message {
          color: #ffcccc;
          font-size: 15px;
          margin-top: 10px;
          text-align: center;
        }

        @media (max-width: 480px) {
          .login-container {
            padding: 25px 15px;
          }

          h2 {
            font-size: 24px;
          }

          input[type="text"],
          input[type="password"] {
            font-size: 14px;
          }

          button {
            font-size: 16px;
          }
        }
    </style>
</head>
<body>
<div class="login-container">
    <h2>Login</h2>
    <form method="post" action="/login">
        <label for="username">Username:</label>
        <input type="text" name="username" placeholder="Enter your username" required>

        <label for="password">Password:</label>
        <input type="password" name="password" placeholder="Enter your password" required>

        <button type="submit">Login</button>
    </form>
    <p class="error-message" id="error-message" style="display: none;"></p>
</div>

<script>
    // Example error message handler
    const errorMessage = ""; // Replace with server-side error
    if (errorMessage) {
      document.getElementById('error-message').innerText = errorMessage;
      document.getElementById('error-message').style.display = 'block';
    }
</script>
</body>
</html>
